---
# main.yml

# This is heavily customized: replace with your own security policies

- import_tasks: packages.yml
- import_tasks: grub.yml

- name: Define group ids
  ansible.builtin.group:
    name: "{{ item.key }}"
    gid: "{{ item.value }}"
  with_dict: "{{ local_groups }}"

- name: Define users
  ansible.builtin.user:
    name: "{{ item.name }}"
    comment: "{{ item.comment if 'comment' in item else item.name }}"
    uid: "{{ item.uid }}"
    createhome: "{{ item.createhome if 'createhome' in item else 'no' }}"
    group: "{{ item.group if 'group' in item else 'nogroup' }}"
    groups: "{{ item.groups if 'groups' in item else '' }}"
    home: "{{ item.home if 'home' in item else '/home/%s' % item.name }}"
    non_unique: "{{ item.non_unique if 'non_unique' in item else 'no' }}"
    password: "{{ vault_users[item.name]['password'] if item.name in
               vault_users and 'password' in vault_users[item.name] else '*' }}"
    shell: "{{ item.shell if 'shell' in item else '/usr/sbin/nologin' }}"
  with_items: "{{ local_users }}"

- name: Allow password auth in sshd
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    line: PasswordAuthentication yes
    regexp: "^PasswordAuthentication .*"
  when: user_security.password_auth
  notify: Restart sshd

- name: Root .ssh directory
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    mode: 0700

- import_tasks: auth-keys.yml
  when: user_security.ssh_auth_keys
- import_tasks: authenticator.yml
  when: user_security.google_authenticator
- import_tasks: sudo-passwd.yml
  when: user_security.sudo_separate_passwords
