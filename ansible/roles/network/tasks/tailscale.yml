---
- name: Add Tailscale repository
  deb822_repository:
    name: tailscale
    types: [ deb ]
    uris: https://pkgs.tailscale.com/stable/ubuntu
    suites: [ "{{ ansible_facts['distribution_release'] | lower }}" ]
    components: [ main ]
    signed_by: "https://pkgs.tailscale.com/stable/ubuntu//{{
      ansible_facts['distribution_release'] }}.noarmor.gpg"

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    update_cache: true
    state: present

- name: Disable telemetry to log.tailscale.com
  ansible.builtin.copy:
    dest: /etc/default/tailscaled
    content: |
      # Managed by ansible
      PORT={{ network.tailscale.port }}
      FLAGS=""
      TS_NO_LOGS_NO_SUPPORT={{ not network.tailscale.telemetry }}
  notify: Restart tailscaled

- name: Start Tailscale
  ansible.builtin.systemd:
    enabled: yes
    name: tailscaled
    state: started
