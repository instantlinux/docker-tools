# Default values for rsyslogd.
# Force reload every week; TODO better way to manage
# storage both inside the container and in host's docker log
livenessProbe:
  exec:
    command: [ 'false' ]
  initialDelaySeconds: 604800

deployment:
  env:
    port: 1514
    tz: UTC
  containerPorts:
  - containerPort: 1514
  podSecurityContext:
    runAsUser: 2028
    runAsGroup: 2028
    fsGroup: 2028
    runAsNonRoot: true
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 64Mi
  
volumeMounts:
- name: config
  mountPath: /etc/rsyslog.d
- name: logrotate
  mountPath: /etc/logrotate.d
- name: logs
  mountPath: /var/log
- name: work
  mountPath: /var/lib/rsyslog
volumes:
- name: config
  configMap:
    name: rsyslogd
- name: logrotate
  configMap:
    name: rsyslogd-logrotate
- name: logs
  emptyDir:
    mode: 0750
- name: work
  emptyDir:
    mode: 0750

image:
  repository: instantlinux/rsyslogd
  pullPolicy: IfNotPresent
  # tag: default

nameOverride: ""
fullnameOverride: ""

serviceAccount: {}
service:
  ports:
  - { port: 514, nodePort: 30514, targetPort: 1514, name: rsyslogd }
  type: NodePort
autoscaling:
  enabled: false

configmap:
  name: rsyslogd
  data:
    custom.conf: |
      # This file created from k8s configmap
      module(load="imtcp")
      input(type="imtcp" port="1514")
      $RepeatedMsgReduction on

      :msg, regex, "Connection closed by 192.168.2.[0-9]\\{1,3\\} \\[preauth\\]" stop
      :msg, contains, "Error: Request packet type/version was invalid" stop
      :msg, contains, "Client request was invalid, bailing out..." stop
      :msg, contains, "required revision has been compacted" stop
      :msg, contains, "connect from unknown[10.244" stop

      *.*;local1.!=info;cron.!=info;local2.!=notice @@splunk:1514
  
