services:
  app:
    image: ${REGISTRY_URI:-instantlinux}/mysqldump:latest
    environment:
      TZ: ${TZ:-UTC}
      SERVERS: ${DB_SERVERS:-dbhost}
    volumes:
    - backup:/var/backup
    - logs:/var/log
    secrets:
    - mysql-backup

volumes:
  logs:
  backup:
    external: true
secrets:
  mysql-backup:
    external: true
