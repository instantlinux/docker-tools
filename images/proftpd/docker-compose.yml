version: "3"

services:
  app:
    image: ${REGISTRY_URI:-instantlinux}/proftpd:${VERSION_PROFTPD:-latest}
    environment:
      PASV_ADDRESS: ${PROFTPD_IP}
      TZ: ${TZ:-UTC}
    cap_drop: [ ALL ]
    cap_add: [ CHOWN, NET_BIND_SERVICE, SETUID, SETGID, SYS_CHROOT ]
    volumes:
    - ftp:/var/lib/ftp:nocopy
    ports:
    - ${PORT_PROFTPD:-21}:21
    - "30091-30100:30091-30100"

volumes:
  ftp:
networks:
  default:
    external:
      name: app_net
