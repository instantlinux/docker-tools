apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "local.fullname" . }}-tailscale
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ include "local.fullname" . }}
  httpUpgrade:
  - type: tailscale-control-protocol
