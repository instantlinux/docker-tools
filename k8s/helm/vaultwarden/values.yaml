# Default values for vaultwarden.
tlsHostname: vaultwarden.example.com
domain: example.com
deployment:
  containerPorts:
  - containerPort: 8080
  - containerPort: 3012
  env:
    domain: https://vault.example.com
    emergency_access_allowed: "true"
    invitation_expiration_hours: 36
    invitations_allowed: "false"
    rocket_port: 8080
    signups_allowed: "true"
    signups_verify: "true"
    smtp_from: admin@example.com
    smtp_host: smtp
    smtp_port: 587
    smtp_security: starttls
    tz: UTC
  xenv:
  - name: ADMIN_TOKEN
    valueFrom:
      secretKeyRef:
        key: admin-token
        name: vaultwarden
  - name: DATABASE_URL
    # in form mysql://username:secret@db00:3306/vaultwarden
    valueFrom:
      secretKeyRef:
        key: database-url
        name: vaultwarden
  podSecurityContext:
    runAsUser: 2003
    runAsGroup: 2003
    fsGroup: 2003
    runAsNonRoot: true
  resources:
    limits:
      cpu: 2
      memory: 2048Mi
    requests:
      cpu: 200m
      memory: 1280Mi
  strategy:
    type: Recreate
  terminationGracePeriodSeconds: 120
livenessProbe:
  httpGet:
    path: /alive
    port: 8080
  initialDelaySeconds: 5
readinessProbe:
  httpGet:
    path: /alive
    port: 8080
  initialDelaySeconds: 5

volumeMounts:
- mountPath: /data
  name: vaultwarden
volumes:
- name: vaultwarden
  hostPath: { path: /var/lib/docker/k8s-volumes/share/vaultwarden }

image:
  repository: vaultwarden/server
  pullPolicy: IfNotPresent
  # tag: default

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
service:
  type: ClusterIP
  ports:
  - { port: 80, targetPort: 8080, name: http }
  - { port: 3012, targetPort: 3012, name: websocket }
autoscaling:
  enabled: false
gateway:
  enabled: true
  external: true
  name: gateway-2
