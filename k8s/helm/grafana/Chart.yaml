apiVersion: v2
name: grafana
description: Grafana metrics visualization and alerting
home: https://github.com/instantlinux/docker-tools
sources:
- https://github.com/instantlinux/docker-tools
- https://github.com/grafana/grafana
type: application
version: 0.1.6
# Reminder, update subchart tags in values.yaml
appVersion: 13.0.6
dependencies:
- name: chartlib
  version: 0.1.11
  repository: oci://ghcr.io/instantlinux/charts
  # also available at oci://registry-1.docker.io/instantlinux
- name: prometheus
  version: 0.1.4
  repository: file://subcharts/prometheus
  condition: prometheus.enabled
- name: alertmanager
  version: 0.1.2
  repository: file://subcharts/alertmanager
  condition: alertmanager.enabled
