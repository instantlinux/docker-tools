# This provides http routes and a service for
#  https://monitor.$domain hosted outside kubernetes.
{{- if or .Values.monitor.enabled (not (hasKey .Valules "monitor.enabled")) }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    kubernetes.io/service-name: {{ .Values.monitor.name }}
  name: {{ .Values.monitor.name }}
  namespace: {{ .Values.namespace }}
spec:
  ports:
  - { port: 80, targetPort: 80, name: monitor }
  type: ClusterIP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: {{ .Values.monitor.name }}
  namespace: {{ .Values.namespace }}
  labels:
    kubernetes.io/service-name: {{ .Values.monitor.name }}
addressType: IPv4
endpoints:
  - addresses: [ {{ .Values.monitor.externalIP }} ]
ports:
  - name: monitor
    protocol: TCP
    port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ .Values.monitor.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.monitor.name }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: gateway-2
    namespace: {{ .Values.namespace }}
  listeners:
  - name: https
    hostname: {{ .Values.monitor.hostname }}
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - name: tls-{{ .Values.monitor.name }}
  - name: http
    hostname: {{ .Values.monitor.hostname }}
    port: 80
    protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.monitor.name }}
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
  - kind: ListenerSet
    name: {{ .Values.monitor.name }}
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ .Values.monitor.name }}
      port: 80
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ .Values.monitor.name }}
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.monitor.name }}-https-redirect
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
  - kind: ListenerSet
    name: {{ .Values.monitor.name }}
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 308
{{ endif }}
