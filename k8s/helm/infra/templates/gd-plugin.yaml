# This installs generic-device-plugin, with addition of a general-purpose
# lookup for usb devices by vendor-id
{{- if or .Values.gdPlugin.enabled (not (hasKey .Values "gdPlugin.enabled")) }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin
  namespace: kube-system
  labels:
    {{- include "local.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-device-plugin
    spec:
      priorityClassName: system-node-critical
      tolerations:
      - operator: "Exists"
        effect: "NoExecute"
      containers:
      - image: squat/generic-device-plugin:{{ .Values.gdPlugin.version }}
        args:
        - --config=/etc/generic-device-plugin/config.yaml
        name: generic-device-plugin
        resources:
          requests:
            cpu: 50m
            memory: 10Mi
          limits:
            cpu: 50m
            memory: 20Mi
        ports:
        - containerPort: 8080
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: device-plugin
          mountPath: /var/lib/kubelet/device-plugins
        - name: dev
          mountPath: /dev
        - name: sys
          mountPath: /sys/bus
          readOnly: true
        - name: config
          mountPath: /etc/generic-device-plugin
      volumes:
      - name: device-plugin
        hostPath:
          path: /var/lib/kubelet/device-plugins
      - name: dev
        hostPath:
          path: /dev
      - name: sys
        hostPath:
          path: /sys/bus
      - name: config
        configMap:
          name: generic-device-plugin-config
  updateStrategy:
    type: RollingUpdate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: generic-device-plugin-config
  namespace: kube-system
  labels:
    {{- include "local.labels" . | nindent 4 }}
data:
  config.yaml: |
    log-level: {{ .Values.gdPlugin.logLevel }}
    devices:
    - name: serial
      groups:
      - paths:
          - path: /dev/ttyUSB*
      - paths:
          - path: /dev/ttyACM*
      - paths:
          - path: /dev/tty.usb*
      - paths:
          - path: /dev/cu.*
      - paths:
          - path: /dev/cuaU*
      - paths:
          - path: /dev/rfcomm*
    - name: video
      groups:
      - paths:
          - path: /dev/video0
    - name: fuse
      groups:
      - count: 10
        paths:
          - path: /dev/fuse
    - name: audio
      groups:
      - count: 10
        paths:
          - path: /dev/snd
    - name: capture
      groups:
      - paths:
          - path: /dev/snd/controlC0
          - path: /dev/snd/pcmC0D0c
      - paths:
          - path: /dev/snd/controlC1
            mountPath: /dev/snd/controlC0
          - path: /dev/snd/pcmC1D0c
            mountPath: /dev/snd/pcmC0D0c
      - paths:
          - path: /dev/snd/controlC2
            mountPath: /dev/snd/controlC0
          - path: /dev/snd/pcmC2D0c
            mountPath: /dev/snd/pcmC0D0c
      - paths:
          - path: /dev/snd/controlC3
            mountPath: /dev/snd/controlC0
          - path: /dev/snd/pcmC3D0c
            mountPath: /dev/snd/pcmC0D0c
    - name: usb
      groups:
      - usb:
        {{- toYaml .Values.gdPlugin.usbVendors | nindent 8 }}
{{- end }}
