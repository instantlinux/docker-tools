---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.namespace }}:prometheus-scraper-binding
  labels:
    {{- include "local.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.namespace }}:prometheus-scraper
subjects:
- kind: ServiceAccount
  name: grafana-prometheus
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.namespace }}:prometheus-scraper
  labels:
    {{- include "local.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources:
  - endpoints
  - nodes
  - pods
  - services
  verbs: [get, list, watch]
- apiGroups: [extensions]
  resources:
  - ingresses
  verbs: [get, list, watch]
- nonResourceURLs: ["/metrics"]
  verbs: [get]
