# Default values for guacd.
deployment:
  containerPorts:
  - { containerPort: 4822 }
  hostname: guacd
  podSecurityContext:
    runAsUser: 1000
  subdomain: guacamole

image:
  repository: guacamole/guacd
  pullPolicy: IfNotPresent
  # tag: default

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
service:
  ports: [ port: 4822 ]
  type: ClusterIP
autoscaling:
  enabled: false
